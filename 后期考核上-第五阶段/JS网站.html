<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原生JS演示网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
            transition: all 0.3s ease;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            color: #222;
            padding: 20px;
        }
        body.dark {
            background: #121212;
            color: #eee;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .text-box {
            font-size: 1.2rem;
            margin: 24px 0;
            min-height: 32px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin: 6px;
            background: #3b82f6;
            color: white;
        }
        button:hover {
            background: #2563eb;
        }
        .dark button {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ 纯JavaScript网站</h1>
        <div class="text-box" id="dynamicText">页面加载完成！</div>
        <button id="changeTextBtn">点击切换文字</button>
        <button id="themeBtn">切换 深色/浅色</button>
        <button id="countBtn">计数器 +1</button>
        <div style="margin-top:20px;font-size:18px;">计数：<span id="num">0</span></div>
    </div>

    <script>
        // 1. 获取DOM元素
        const dynamicText = document.getElementById('dynamicText');
        const changeTextBtn = document.getElementById('changeTextBtn');
        const themeBtn = document.getElementById('themeBtn');
        const countBtn = document.getElementById('countBtn');
        const numSpan = document.getElementById('num');

        // 2. 计数器
        let count = 0;
        countBtn.onclick = function() {
            count++;
            numSpan.innerText = count;
        }

        // 3. 切换文字数组
        const wordList = [
            "Hello JavaScript",
            "原生JS不需要框架",
            "可以直接部署到GitHub Pages",
            "前端基础练习Demo"
        ];
        let index = 0;
        changeTextBtn.addEventListener('click', () => {
            index = (index + 1) % wordList.length;
            dynamicText.innerText = wordList[index];
        })

        // 4. 深浅色主题切换
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
        })
    </script>
</body>
</html>
